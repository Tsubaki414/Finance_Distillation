<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容审核</title><link rel="stylesheet" href="/assets/localization-review.css"><body>
<header><a href="/">← 工作台</a><h1>内容审核</h1><p>对照原文，选择并编辑值得采用的稿件。候选的生成方式在提交前隐藏。</p></header>
<main><label>选择来源 <select id="sources"></select></label><p id="status" role="status"></p>
<section class="comparison"><article><h2>原文</h2><p id="provenance"></p><div id="original" class="copy"></div></article><div id="candidates"></div></section>
<section id="editor" hidden><h2>编辑成稿</h2><form id="review-form"><label>你的姓名或审核标识<input id="reviewer" required autocomplete="name"></label><label>正文<textarea id="edited" rows="14"></textarea></label><div class="two"><label>修改原因（可选）<textarea id="reason" rows="3"></textarea></label><label>分类标签（可选，以逗号分隔）<input id="categories" placeholder="例如：身份归属、保留比喻"></label></div><div class="actions"><button name="decision" value="save">保存修改</button><button name="decision" value="approve">通过</button><button name="decision" value="reject">不采用</button></div></form></section>
<section id="machine-review" hidden><h2>机器核对记录</h2><p>你的判断已保存；以下记录不属于正文。</p><pre id="machine-detail" class="copy"></pre></section>
<section id="publication" hidden><h2>登记已发布稿</h2><p>这里只记录你已经发布的帖子。</p><form id="publication-form"><label>平台<input id="platform" required></label><label>帖子 ID<input id="post-id" required></label><label>发布时间（含时区）<input id="published-at" placeholder="2026-09-29T10:00:00+00:00" required></label><label>帖子链接（可选）<input id="post-url" type="url"></label><button>保存关联</button></form></section>
<section id="engagement" hidden><h2>记录后续表现</h2><form id="engagement-form"><label>观察时间（含时区）<input id="observed-at" required></label><label>曝光量<input id="views" type="number" min="0" required></label><label>点赞数<input id="likes" type="number" min="0" required></label><label>数据依据<input id="metric-source" placeholder="例如：平台后台，或导出文件名" required></label><button>保存快照</button></form></section>
</main><script src="/assets/localization-review.js"></script></body></html>
